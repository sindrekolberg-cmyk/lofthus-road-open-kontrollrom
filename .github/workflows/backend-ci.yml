name: Backend CI

on:
  push:
    branches: [integration-v2]
  pull_request:
    branches: [integration-v2, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      LRO_API_WARMUP: '0'
      LRO_PUSH_MONITOR: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q api lro_*.py
      - name: Run tests
        run: python -m pytest -q
